<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorkShift Spine Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header>
        <h1>Spine Sync</h1>
        <p class="sub">Pull today’s punches without leaving WorkShift (Spine stays in a background tab)</p>
      </header>

      <p id="status" class="status">Ready.</p>

      <div class="actions">
        <button id="btnSync" type="button" class="primary">Sync today</button>
        <button id="btnOpen" type="button" class="ghost">Open Spine</button>
      </div>

      <details class="creds">
        <summary>Optional saved credentials</summary>
        <p class="warn">
          Prefer signing into Spine in your browser. Saved passwords are stored in
          <code>chrome.storage.local</code> (not as strong as OS DPAPI).
        </p>
        <label>
          Username
          <input id="username" type="text" autocomplete="username" />
        </label>
        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" />
        </label>
        <label class="row">
          <input id="saveCreds" type="checkbox" />
          Save credentials for auto-login fallback
        </label>
        <button id="btnSaveCreds" type="button" class="ghost">Save settings</button>
      </details>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
