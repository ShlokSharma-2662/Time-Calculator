# Azure DevOps CI/CD pipeline for WorkShift Calc
# Setup: Pipelines → New pipeline → Azure Repos / GitHub → Existing YAML → this file
#
# Required pipeline variables (mark as secret) or Variable Group "workshift-web-build":
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   AZURE_STATIC_WEB_APPS_API_TOKEN   # from Azure Portal → Static Web App → Manage deployment token
# Optional:
#   VITE_FIREBASE_MEASUREMENT_ID

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - LICENSE
      - '**/*.md'

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - name: nodeVersion
    value: '22.x'
  - group: workshift-web-build

stages:
  - stage: Build
    displayName: Build and validate
    jobs:
      - job: WebApp
        displayName: Web app (Vite)
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: Install web dependencies

          - script: |
              set -e
              fail=0
              check() {
                name="$1"
                val="$2"
                if [ -z "$val" ]; then
                  echo "##vso[task.logissue type=error]$name is empty — check Library group workshift-web-build and pipeline authorization"
                  fail=1
                elif echo "$val" | grep -q '\$('; then
                  echo "##vso[task.logissue type=error]$name was not expanded (literal \$(...) seen) — authorize the variable group for this pipeline"
                  fail=1
                fi
              }
              check VITE_FIREBASE_API_KEY "$VITE_FIREBASE_API_KEY"
              check VITE_FIREBASE_AUTH_DOMAIN "$VITE_FIREBASE_AUTH_DOMAIN"
              check VITE_FIREBASE_PROJECT_ID "$VITE_FIREBASE_PROJECT_ID"
              check VITE_FIREBASE_STORAGE_BUCKET "$VITE_FIREBASE_STORAGE_BUCKET"
              check VITE_FIREBASE_MESSAGING_SENDER_ID "$VITE_FIREBASE_MESSAGING_SENDER_ID"
              check VITE_FIREBASE_APP_ID "$VITE_FIREBASE_APP_ID"

              # Format check without printing the secret
              KEY="$VITE_FIREBASE_API_KEY"
              KEY="${KEY%\"}"; KEY="${KEY#\"}"; KEY="${KEY%\'}"; KEY="${KEY#\'}"
              case "$KEY" in
                AIza*)
                  LEN=${#KEY}
                  if [ "$LEN" -lt 39 ]; then
                    echo "##vso[task.logissue type=error]VITE_FIREBASE_API_KEY looks truncated (length $LEN)"
                    fail=1
                  else
                    echo "VITE_FIREBASE_API_KEY format OK (length $LEN, starts with AIza)"
                  fi
                  ;;
                *)
                  echo "##vso[task.logissue type=error]VITE_FIREBASE_API_KEY must start with AIza (got length ${#KEY})"
                  fail=1
                  ;;
              esac

              if [ "$fail" -ne 0 ]; then
                echo "##vso[task.complete result=Failed;]"
                exit 1
              fi
            displayName: Validate Firebase env vars
            env:
              VITE_FIREBASE_API_KEY: $(VITE_FIREBASE_API_KEY)
              VITE_FIREBASE_AUTH_DOMAIN: $(VITE_FIREBASE_AUTH_DOMAIN)
              VITE_FIREBASE_PROJECT_ID: $(VITE_FIREBASE_PROJECT_ID)
              VITE_FIREBASE_STORAGE_BUCKET: $(VITE_FIREBASE_STORAGE_BUCKET)
              VITE_FIREBASE_MESSAGING_SENDER_ID: $(VITE_FIREBASE_MESSAGING_SENDER_ID)
              VITE_FIREBASE_APP_ID: $(VITE_FIREBASE_APP_ID)

          - script: npm run lint
            displayName: Lint
          - script: npm run build
            displayName: Build production bundle
            env:
              VITE_FIREBASE_API_KEY: $(VITE_FIREBASE_API_KEY)
              VITE_FIREBASE_AUTH_DOMAIN: $(VITE_FIREBASE_AUTH_DOMAIN)
              VITE_FIREBASE_PROJECT_ID: $(VITE_FIREBASE_PROJECT_ID)
              VITE_FIREBASE_STORAGE_BUCKET: $(VITE_FIREBASE_STORAGE_BUCKET)
              VITE_FIREBASE_MESSAGING_SENDER_ID: $(VITE_FIREBASE_MESSAGING_SENDER_ID)
              VITE_FIREBASE_APP_ID: $(VITE_FIREBASE_APP_ID)
              VITE_FIREBASE_MEASUREMENT_ID: $(VITE_FIREBASE_MEASUREMENT_ID)

          - task: PublishPipelineArtifact@1
            displayName: Publish web dist artifact
            inputs:
              targetPath: dist
              artifactName: web-dist
              publishLocation: pipeline

      - job: Api
        displayName: Express API (install check)
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            workingDirectory: server
            displayName: Install API dependencies

          - script: node --check server.js && node --check db.js && node --check routes/auth.js && node --check routes/logs.js
            workingDirectory: server
            displayName: Syntax-check API entrypoints

  # Deploys only on branch builds (not PR validation builds)
  - stage: Deploy
    displayName: Deploy to Azure Static Web Apps
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: DeployWeb
        displayName: Deploy web-dist
        steps:
          - download: current
            artifact: web-dist

          - task: AzureStaticWebApp@0
            displayName: Deploy to Static Web Apps
            inputs:
              workingDirectory: $(Pipeline.Workspace)/web-dist
              app_location: '/'
              api_location: ''
              output_location: ''
              skip_app_build: true
              skip_api_build: true
              azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
