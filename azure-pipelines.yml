# Azure DevOps CI pipeline for WorkShift Calc
# Setup: Pipelines → New pipeline → Azure Repos / GitHub → Existing YAML → this file
#
# Required pipeline variables (mark as secret) or Variable Group "workshift-web-build":
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
# Optional:
#   VITE_FIREBASE_MEASUREMENT_ID

trigger:
  branches:
    include:
      - main
      - codex/*
      - cursor/*
  paths:
    exclude:
      - README.md
      - LICENSE
      - '**/*.md'

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'
  # Uncomment after creating the variable group in Library:
  # - group: workshift-web-build

stages:
  - stage: Build
    displayName: Build and validate
    jobs:
      - job: WebApp
        displayName: Web app (Vite)
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: Install web dependencies

          - script: npm run lint
            displayName: Lint

          - script: npm run build
            displayName: Build production bundle
            env:
              VITE_FIREBASE_API_KEY: $(VITE_FIREBASE_API_KEY)
              VITE_FIREBASE_AUTH_DOMAIN: $(VITE_FIREBASE_AUTH_DOMAIN)
              VITE_FIREBASE_PROJECT_ID: $(VITE_FIREBASE_PROJECT_ID)
              VITE_FIREBASE_STORAGE_BUCKET: $(VITE_FIREBASE_STORAGE_BUCKET)
              VITE_FIREBASE_MESSAGING_SENDER_ID: $(VITE_FIREBASE_MESSAGING_SENDER_ID)
              VITE_FIREBASE_APP_ID: $(VITE_FIREBASE_APP_ID)
              VITE_FIREBASE_MEASUREMENT_ID: $(VITE_FIREBASE_MEASUREMENT_ID)

          - task: PublishPipelineArtifact@1
            displayName: Publish web dist artifact
            inputs:
              targetPath: dist
              artifactName: web-dist
              publishLocation: pipeline

      - job: Api
        displayName: Express API (install check)
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            workingDirectory: server
            displayName: Install API dependencies

          - script: node --check server.js && node --check db.js && node --check routes/auth.js && node --check routes/logs.js
            workingDirectory: server
            displayName: Syntax-check API entrypoints
